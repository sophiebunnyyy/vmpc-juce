name: Android Standalone Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-36" \
                     "build-tools;36.0.0" \
                     "ndk;28.1.13356709"

      - name: Show Android tools
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo
          echo "Installed CMake versions:"
          ls -la "$ANDROID_SDK_ROOT/cmake" || true
          echo
          echo "Installed NDK versions:"
          ls -la "$ANDROID_SDK_ROOT/ndk" || true
          echo
          echo "CMake version:"
          cmake --version || true

      - name: Build Android APK
        id: build
        working-directory: android
        continue-on-error: true
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee ../android-build.log

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: VMPC2000XL-build-log
          path: android-build.log
          if-no-files-found: error

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: VMPC2000XL-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
