name: Android Standalone Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Show available Android tools
        run: |
          echo "Installed CMake versions:"
          ls -la "$ANDROID_SDK_ROOT/cmake" || true
          echo
          echo "Installed NDK versions:"
          ls -la "$ANDROID_SDK_ROOT/ndk" || true
          echo
          echo "CMake version:"
          cmake --version || true

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-36" \
                     "build-tools;36.0.0" \
                     "ndk;28.1.13356709"

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VMPC2000XL-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
